# Local stores for development and tests (spec 008, T009).
# The API (3001) and the web app (3000) run on the host through `make dev`.
# All ports bind to 127.0.0.1. Run through `make up`, which passes --env-file .env.

name: graph-coach

services:
  falkordb:
    # Pinned 2026-10-14: falkordb/falkordb:6.0.2 (digest sha256:107455e862a8…, built 2026-10-08),
    # the image used by umbrella spike S1; to be confirmed by spikes S2 and S9.
    image: falkordb/falkordb:6.0.2
    environment:
      # The image's default query timeout is 1000 ms (reconciliation L2). Raised to 5000 ms here.
      FALKORDB_ARGS: 'MAX_QUEUED_QUERIES 25 TIMEOUT 5000 RESULTSET_SIZE 10000'
    ports:
      - '127.0.0.1:${FALKORDB_PORT:-6379}:6379'
      - '127.0.0.1:${FALKORDB_UI_PORT:-3002}:3000'
    volumes:
      - falkordb-data:/var/lib/falkordb/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    # Pinned 2026-10-14: the current 16.x Alpine release.
    image: postgres:16.15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-coach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coach}
      POSTGRES_DB: ${POSTGRES_DB:-coach}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  falkordb-data:
  postgres-data:
